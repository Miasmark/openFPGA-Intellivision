; CFG zoo 6 (step 8): lines without PAGE in a paged 4K range stay mapped on
; every page, as in jzIntv (docs/CARTFORMATS.md 2.2). Our own text (MIT).
[mapping]
$0000 - $0FFF = $5000
$1000 - $17FF = $D000           ; no PAGE: $D000-$D7FF on every page of $D000
$1800 - $1FFF = $D800 PAGE 1
$2000 - $207F = $D880 PAGE 2    ; half a block on page 2: $D800-$D87F not answered
$2100 - $2133 = $C010           ; no PAGE, part of a block, in a paged range: one pool block
$2200 - $22FF = $C800 PAGE 3
$2300 - $2302 = $C900 PAGE 3    ; three words of a block
[vars]
voice = 1
