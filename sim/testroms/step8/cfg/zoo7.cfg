; CFG zoo 7 (step 8): the corners where we differ from jzIntv on purpose
; (docs/CARTFORMATS.md 2.2): [memattr] RAM in a paged range, and a PAGE line
; and a line without PAGE on the same words. Our own text (MIT).
[mapping]
$0000 - $0FFF = $5000
$1000 - $1FFF = $A000 PAGE 1    ; page 1 of $A000, over the RAM below
$2000 - $203F = $B000 PAGE 2    ; page 2's words replace the line below's
$2100 - $21FF = $B000           ; no PAGE: $B000-$B0FF on every page
[memattr]
$A800 - $A8FF = RAM 16          ; cart RAM on every page of $A000
$A900 - $A907 = RAM 8           ; eight cells: only they answer
