; CFG zoo 1 (step 8): the grammar's corners. Our own text (MIT).
; CRLF line ends, tabs, no $, lower and upper case, comments after values.

[MAPPING]
	$0000 - $07FF = $5000	; 2K at $5000
0800-0FFF=6000
$1000 - $10ff = $d000 ; a block
$1100 - $1103 = $D100
[macro]
@W FOO $105
[Bogus Section]
$0000 - $FFFF = $0000
[memattr]
$8000 - $80FF = RAM
$8100 - $81FF = wom 16
$D100 - $D1FF = ROM 8
$9000-$9000=ram 8
[vars]
name = "Zoo 1"
ecs_compat = 0
voice_compat=2
unknown_var = 7
JLP = 3
