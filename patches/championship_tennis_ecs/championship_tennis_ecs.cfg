; Championship Tennis (INTV 1985) with the ECS page fix (openFPGA-Intellivision
; patches/championship_tennis_ecs). The patched image's CRC is in no game list, so
; this file gives its memory map: 8K words at $5000, 8K words at $D000.
[mapping]
$0000 - $1FFF = $5000
$2000 - $3FFF = $D000

[vars]
; tolerates the ECS: Auto leaves the ECS attached (no ECS menu), and with
; ECS set to On (or a real ECS) the game now runs too
ecs_compat = 1
