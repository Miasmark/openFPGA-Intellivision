; Championship Tennis (INTV 1985) with the ECS: page fix and four human players
; (openFPGA-Intellivision patches/championship_tennis_ecs). The patched image's CRC is in no
; game list, so this file gives its memory map: 8K words at $5000, 8K words at $D000.
[mapping]
$0000 - $1FFF = $5000
$2000 - $3FFF = $D000

[vars]
; tolerates the ECS: Auto leaves the ECS attached (no ECS menu; its RAM and hand-controller
; ports answer, which is all the four-player code needs), and with ECS set to On (or a real
; ECS) the game runs too. With ECS Off it plays as the original, two players.
ecs_compat = 1
