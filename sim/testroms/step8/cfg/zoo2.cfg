; CFG zoo 2 (step 8): Intellicart bank switching from a CFG (intellicart.txt's
; BIN2ROM sections). Our own text (MIT).
[mapping]
$0000 - $0FFF = $5000      ; code
[preload]
$1000 - $17FF = $1000      ; Intellicart memory only
$1800 - $18FF = $3000
[bankswitch]
$6000 - $67FF
$6800 - $6FFF
[memattr]
$6800 - $6FFF = RAM 16      ; a bank window that writes: no save state
$A000 - $A3FF = RAM 16
[vars]
jlp_accel = 1
